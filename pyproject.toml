[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-learning-os"
version = "0.1.0"
description = "A Markdown-first personal AI learning and research training system"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Codex Learning OS contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
yaml = ["PyYAML>=6.0"]
typed = ["pydantic>=2.0", "typer>=0.12"]

[project.scripts]
learning-os = "learning_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
